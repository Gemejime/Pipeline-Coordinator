{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-ingestion-coordinator.fullname" . }}
  labels:
    {{- include "rag-ingestion-coordinator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "rag-ingestion-coordinator.selectorLabels" . | nindent 6 }}
  template:
    {{- include "rag-ingestion-coordinator.podTemplate" . | nindent 4 }}
{{- end }}

