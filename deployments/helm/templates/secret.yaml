{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-secrets" (include "rag-ingestion-coordinator.fullname" .)) .Values.secrets.existingSecret }}
  labels:
    {{- include "rag-ingestion-coordinator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.stringData }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}

